name: Trigger QA Selenium Regression

on:
  push:
    branches: [master]

  workflow_dispatch:

permissions:
  contents: read

jobs:
  trigger-qa:
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Selenium Regression in QA Repository
        env:
          GH_TOKEN: ${{ secrets.QA_REPO_DISPATCH_TOKEN }}
        run: |
          curl --fail-with-body --silent --show-error \
            --request POST \
            --header "Accept: application/vnd.github+json" \
            --header "Authorization: Bearer $GH_TOKEN" \
            --header "X-GitHub-Api-Version: 2022-11-28" \
            https://api.github.com/repos/QuangDoan7/movies-collection-qa-automation/dispatches \
            --data '{"event_type":"movies_collection_updated"}'
